<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comma Clips</title>
<style>
  :root { color-scheme: dark light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1115; color: #e9ebf0;
    font: 16px/1.5 system-ui, sans-serif; padding: 16px; }
  @media (prefers-color-scheme: light) { body { background: #f4f5f7; color: #171a20; } }
  .box { max-width: 420px; }
  form { display: flex; gap: 8px; margin-top: 12px; }
  input { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #888; font: inherit; background: transparent; color: inherit; }
  button { padding: 10px 16px; border-radius: 10px; border: 0; background: #4fb477; color: #06210f; font: inherit; font-weight: 600; }
</style></head>
<body><div class="box">
  <h1>Comma Clips</h1>
  <p>This page needs the access key. Open the link printed when the server starts (it ends in <code>?k=…</code>), or paste the key here.</p>
  <form action="/" method="get"><input name="k" placeholder="access key" autocomplete="off" required><button>Open</button></form>
</div></body></html>
